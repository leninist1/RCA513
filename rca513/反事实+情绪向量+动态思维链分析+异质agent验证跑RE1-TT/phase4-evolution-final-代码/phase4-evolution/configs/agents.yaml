agents:
  claude_proxy:
    llm_client: "claude"
    model: "claude-sonnet-4-6"
    api_key_env: "CLAUDE_API_KEY"
    base_url_env: "CLAUDE_BASE_URL"
    attribution_philosophy: "topology_fingerprint"
    search_bias: "end_to_end_refactor"
    internal_state:
      u: 0.72
      c: 0.45
      s: 3
      e: 0.90

  deepseek:
    llm_client: "deepseek"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    attribution_philosophy: "earliest_anomaly"
    search_bias: "structured_decomposition"
    internal_state:
      u: 0.68
      c: 0.5
      s: 2
      e: 0.80
